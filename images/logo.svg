<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF5B7" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#FDF0CD" />
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F0C1B" />
      <stop offset="100%" stop-color="#40030C" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield / Diamond Ring -->
    <circle cx="32" cy="32" r="30" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2,2" />
    
    <!-- Royal Crown Accent on top of badge -->
    <path d="M22 20 L27 24 L32 17 L37 24 L42 20 L40 27 L24 27 Z" fill="url(#goldGrad)" opacity="0.95" />
    
    <!-- Monogram Letters DKJ -->
    <text x="32" y="44" 
          font-family="'Bodoni Moda', 'Playfair Display', 'Cinzel', Georgia, serif" 
          font-size="16" 
          font-weight="700" 
          letter-spacing="2" 
          fill="url(#goldGrad)" 
          text-anchor="middle"
          filter="url(#goldGlow)">DKJ</text>

    <!-- Small Star below -->
    <polygon points="32,49 33.2,52.2 36.5,52.4 34,54.5 34.8,57.7 32,55.8 29.2,57.7 30,54.5 27.5,52.4 30.8,52.2" fill="url(#goldGrad)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(86, 18)">
    <!-- Main Brand Name -->
    <text x="0" y="27" 
          font-family="'Playfair Display', 'Bodoni Moda', Georgia, serif" 
          font-size="26" 
          font-weight="700" 
          letter-spacing="3" 
          fill="url(#goldGrad)">DK JEWELLERS</text>
    
    <!-- Small Tagline / Heritage label -->
    <text x="2" y="44" 
          font-family="'Poppins', 'Montserrat', sans-serif" 
          font-size="8.5" 
          font-weight="500" 
          letter-spacing="4.5" 
          fill="#E5D3B3">TIMELESS PURITY &amp; CRAFTSMANSHIP</text>
          
    <!-- Decorative Underline with tiny diamond -->
    <line x1="2" y1="50" x2="90" y2="50" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.7"/>
    <polygon points="95,50 97,48 99,50 97,52" fill="url(#goldGrad)"/>
    <line x1="104" y1="50" x2="215" y2="50" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.7"/>
  </g>
</svg>
